load:
  # =============================================================
  # DISEÑO PROPUESTO — validado contra database-seeder.service.ts
  # Escenario base: "operación normal". Variante de estrés al final.
  # =============================================================

  # --- Dimensiones del negocio ---
  tiendas: 200          # tenderos activos. Mínimo permitido: 2.
  zonas: 5                # = cantidad de zonaBaseNames reales (Norte, Sur,
                            # Oriente, Occidente, Centro), evita nombres
                            # genéricos "Zona 6+".

  distribucion:
    tipo: pareto
    peso_cabeza: 0.8       # el balde "cabeza" concentra el 80% de las
                             # asignaciones de tienda/zona/producto.
    fraccion_cabeza: 0.2   # con zonas=5 esto da headCount=1: UNA sola zona
                             # cabeza -> resulta ser "Zona Norte" (índice 0),
                             # la misma que consulta el GET bajo prueba.
                             # Con tiendas=200 da headCount=40: un balde de
                             # 40 tiendas "cabeza" (no una sola dominante).

  # --- Logística (críticas para ASR1 y ASR2) ---
  productos: 1500
  catalogos: 50            # múltiplo de 10 -> 5 ciclos completos del
                             # algoritmo pareto, evita que zonas queden sin
                             # NINGÚN catálogo asignado (con <10 colapsa).
                             # Resultado esperado: ~40 catálogos en Zona
                             # Norte (cabeza), ~10 repartidos en las otras 4.
  catalogos_productos: 30000  # cubre por completo los primeros ~20 catálogos
                                # en orden de inserción (los de Zona Norte
                                # van primero) -> buena cobertura donde más
                                # importa para el GET bajo prueba.
  promociones: 250          # ~17% del catálogo en promoción. El productoId
                              # de promociones es ROUND-ROBIN (no pareto) en
                              # este seeder; el sesgo real está en qué
                              # TIENDAS tienen la promoción (promocion_tiendas
                              # sí usa pareto).
  pedidos: 4000              # histórico TOTAL, repartido pareto entre
                               # tiendas: 40 tiendas "cabeza" se reparten
                               # ~3200 pedidos, 160 tiendas "cola" ~800.
                               # La tienda de prueba (índice 0) cae siempre
                               # en el balde cabeza.
  items_pedido: 12000         # ~3 ítems/pedido en promedio. El productoId
                               # de cada ítem SÍ es pareto (20% de productos
                               # concentra el 80% de los ítems vendidos).
  despachos: 3600
  disponibilidad_zona: 4500   # ROUND-ROBIN uniforme entre TODOS los
                                # catálogos y productos (no pareto) -> da
                                # cobertura pareja (~90 filas/catálogo).
  notas_credito: 150

  # --- Inventario / Ventas (usan solo las 2 tiendas hardcodeadas,
  #     NO escalan con 'tiendas'; menos relevantes para ASR1/ASR2) ---
  items_inventario: 1500
  registros_compra_producto_tienda: 800
  registros_venta_producto_tienda: 800
  productos_externos: 200
  ventas: 1000
  items_venta: 3000

# ==========================================================================
# VARIANTE — "Estrés fuerte / evento de promociones" (fuerza ASR2 y encarece
# el GET al mismo tiempo, subiendo aún más el histórico de la tienda cabeza)
# ==========================================================================
# load:
#   tiendas: 200
#   zonas: 5
#   distribucion:
#     tipo: pareto
#     peso_cabeza: 0.9
#     fraccion_cabeza: 0.2
#   productos: 1500
#   catalogos: 50
#   catalogos_productos: 30000
#   promociones: 450
#   pedidos: 8000
#   items_pedido: 24000
#   despachos: 7000
#   disponibilidad_zona: 4500
#   notas_credito: 300
#   items_inventario: 1500
#   registros_compra_producto_tienda: 800
#   registros_venta_producto_tienda: 800
#   productos_externos: 200
#   ventas: 1000
#   items_venta: 3000